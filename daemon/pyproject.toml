[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physical-context-daemon"
version = "0.1.0"
description = "Local capture and retrieval daemon for Physical Context Layer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "opencv-python-headless>=4.13,<5",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlite-vec>=0.1.6,<0.2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
pcl-daemon = "physical_context.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/physical_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
